<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER: Greeting & Time ===== -->
  <header class="header">
    <div class="header__left">
      <p id="greeting" class="greeting"></p>
      <p id="datetime" class="datetime"></p>
    </div>
    <div class="header__right">
      <!-- Dark / Light mode toggle -->
      <button id="theme-toggle" class="btn btn--icon" aria-label="Toggle theme" title="Toggle Light / Dark mode">
        <span id="theme-icon">🌙</span>
      </button>
      <!-- Custom name button -->
      <button id="set-name-btn" class="btn btn--outline" title="Set your name">✏️ Name</button>
    </div>
  </header>

  <!-- ===== NAME MODAL ===== -->
  <div id="name-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__box">
      <h2 id="modal-title">What's your name?</h2>
      <input id="name-input" class="input" type="text" placeholder="Enter your name..." maxlength="30" />
      <div class="modal__actions">
        <button id="save-name-btn" class="btn btn--primary">Save</button>
        <button id="cancel-name-btn" class="btn btn--outline">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard">

    <!-- ── FOCUS TIMER ── -->
    <section class="card" id="timer-card" aria-labelledby="timer-heading">
      <h2 id="timer-heading" class="card__title">🍅 Focus Timer</h2>

      <div class="timer__display" id="timer-display" aria-live="polite">25:00</div>

      <!-- Custom duration input (Challenge: Change Pomodoro time) -->
      <div class="timer__custom">
        <label for="timer-minutes" class="label">Set minutes:</label>
        <input id="timer-minutes" class="input input--sm" type="number" min="1" max="120" value="25" />
        <button id="apply-timer-btn" class="btn btn--sm btn--outline">Apply</button>
      </div>

      <div class="timer__controls">
        <button id="start-btn" class="btn btn--primary">▶ Start</button>
        <button id="stop-btn"  class="btn btn--outline">⏸ Stop</button>
        <button id="reset-btn" class="btn btn--outline">↺ Reset</button>
      </div>

      <p id="timer-status" class="timer__status" aria-live="polite"></p>
    </section>

    <!-- ── TO-DO LIST ── -->
    <section class="card" id="todo-card" aria-labelledby="todo-heading">
      <h2 id="todo-heading" class="card__title">✅ To-Do List</h2>

      <!-- Add task row -->
      <div class="todo__add-row">
        <input id="task-input" class="input" type="text" placeholder="Add a new task…" maxlength="100" />
        <button id="add-task-btn" class="btn btn--primary">Add</button>
      </div>

      <!-- Sort control (Challenge: Sort tasks) -->
      <div class="todo__sort-row">
        <label for="sort-select" class="label">Sort:</label>
        <select id="sort-select" class="select">
          <option value="default">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
        </select>
      </div>

      <p id="todo-error" class="error-msg hidden" role="alert"></p>

      <ul id="task-list" class="task-list" aria-label="Task list"></ul>

      <p id="todo-empty" class="empty-msg">No tasks yet. Add one above! 🎉</p>
    </section>

    <!-- ── QUICK LINKS ── -->
    <section class="card" id="links-card" aria-labelledby="links-heading">
      <h2 id="links-heading" class="card__title">🔗 Quick Links</h2>

      <!-- Add link row -->
      <div class="links__add-row">
        <input id="link-name-input" class="input" type="text" placeholder="Label (e.g. YouTube)" maxlength="30" />
        <input id="link-url-input"  class="input" type="url"  placeholder="https://…" />
        <button id="add-link-btn" class="btn btn--primary">Add</button>
      </div>

      <p id="links-error" class="error-msg hidden" role="alert"></p>

      <div id="links-list" class="links-list" aria-label="Quick links"></div>

      <p id="links-empty" class="empty-msg">No links saved yet.</p>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
